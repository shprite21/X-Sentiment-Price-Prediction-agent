[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "x-sentiment-price-agent"
version = "1.0.0"
description = "Point-in-time X sentiment and BTC price forecasting with purged walk-forward evaluation"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scikit-learn==1.6.1",
  "vaderSentiment==3.3.2", "plotly==6.1.2", "python-dotenv==1.1.0",
  "SQLAlchemy==2.0.43", "matplotlib==3.11.2", "exchange-calendars==4.13.3",
  "yfinance==1.8.0", "apify-client==1.12.2", "tavily-python==0.8.5", "exa-py==2.28.0",
  "threadpoolctl>=3.5,<4", "joblib>=1.4,<2"
]

[project.optional-dependencies]
finbert = ["transformers==4.57.6", "torch==2.15.0", "huggingface-hub==0.36.2"]

[tool.ruff]
line-length = 108
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[project.scripts]
xsentiment = "xsentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
